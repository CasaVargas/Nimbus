name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App build and tests
    # Xcode 16.4 (macos-15), 26.3 (macos-15) and 26.6 (macos-26) all crash in
    # IRGen on this codebase (swift-frontend aborts in SyncCallEmission::setArgs
    # while emitting a reabstraction thunk for TransferNotificationMode in
    # TransferSettingsView). Xcode 27 compiles it, so the app job runs on the
    # xcode-27 image (macOS 27 + Xcode 27, GitHub-hosted, currently labelled
    # preview). Move back to a GA macos-* label once one ships Xcode 27.
    # TODO: re-test on macos-26 when its default Xcode is 27.
    runs-on: xcode-27
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -n 1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"

      - name: Install XcodeGen and rclone
        run: brew install xcodegen rclone

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodegen --version
          rclone version | head -n 1

      - name: Generate Xcode project
        working-directory: Nimbus
        run: |
          xcodegen generate
          # xcodegen rewrites the extension's Info.plist with literal version
          # numbers in place of $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION).
          # Restore the committed one so the extension version tracks the app.
          git checkout -- FileProviderExtension/Info.plist

      # Builds and tests run without a signing identity. The app and the File
      # Provider extension carry app-group entitlements, so without
      # CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO xcodebuild demands a
      # provisioning profile even for ad-hoc signing.
      - name: Build (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Nimbus/Nimbus.xcodeproj \
            -scheme Nimbus \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # The two skips below are known, pre-existing failures that do not
      # indicate a regression:
      #   - EmptyStateTests/rendersWithCTA: ImageRenderer leaves a gap in the
      #     offscreen render that the perceptual-hash fixture does not tolerate.
      #   - RcloneConfigMachineTests: pins the question order of an older
      #     rclone release; Homebrew installs a newer one.
      # The Settings snapshots used to be skipped too. Their two causes are
      # fixed in SnapshotHelpers: captures are a fixed 2x (no longer the
      # display's scale), and each render gets its own window (concurrent
      # suites used to swap content in a shared one mid-render).
      # TODO: fix each of these and remove the corresponding -skip-testing.
      - name: Test (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Nimbus/Nimbus.xcodeproj \
            -scheme Nimbus \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            test \
            '-skip-testing:NimbusTests/EmptyStateTests/rendersWithCTA()' \
            -skip-testing:NimbusTests/RcloneConfigMachineTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore

  rclonekit:
    name: RcloneKit swift test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: swift --version

      - name: swift test
        working-directory: RcloneKit
        run: swift test
