name: CodeQL

# Replaces GitHub's CodeQL "default setup", which scanned the Swift code on
# every pull request and every push. That scan builds the whole app on a
# macOS runner and takes 12 to 25 minutes.
#
# - Swift: weekly, and on pushes to main that change the app or RcloneKit.
#   Never on pull requests.
# - Workflow files (the "actions" language, under a minute): on pull requests
#   and pushes that change .github/, and weekly.

on:
  push:
    branches: [main]
    paths:
      - 'Nimbus/**'
      - 'RcloneKit/**'
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions

  swift:
    name: Analyze (swift)
    if: github.event_name != 'pull_request'
    # Same image and build mode as default setup, whose analysis succeeded
    # there: macos-26, autobuild with the image's default Xcode. Not the
    # xcode-27 image ci.yml builds on; CodeQL is untested on it.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: autobuild
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
