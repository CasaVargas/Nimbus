name: Nimbus
options:
  bundleIdPrefix: app.casavargas
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  RcloneKit:
    path: ../RcloneKit

targets:
  Nimbus:
    type: application
    platform: macOS
    sources:
      - path: Nimbus
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: RcloneKit
      - target: FileProviderExtension
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
    preBuildScripts:
      - name: Lint — no .system(size:)
        script: |
          bash "$SRCROOT/../scripts/lint-no-system-size.sh"
        basedOnDependencyAnalysis: false
      - name: Lint — Package.resolved allowlist
        script: |
          bash "$SRCROOT/../scripts/lint-package-resolved.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.casavargas.nimbus
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: Nimbus
        CODE_SIGN_ENTITLEMENTS: Nimbus/Nimbus.entitlements
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 53MUTM55LC

  FileProviderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProviderExtension
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: RcloneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.casavargas.nimbus.FileProvider
        CODE_SIGN_ENTITLEMENTS: FileProviderExtension/FileProviderExtension.entitlements
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 53MUTM55LC
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.fileprovider-nonui
    info:
      path: FileProviderExtension/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionFileProviderDocumentGroup: group.app.casavargas.nimbus
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension

  NimbusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NimbusTests
        excludes:
          - "**/.DS_Store"
          - "Fixtures/**"
    dependencies:
      - target: Nimbus
      - package: RcloneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.casavargas.nimbus.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Nimbus.app/Contents/MacOS/Nimbus
